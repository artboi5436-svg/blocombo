<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Блок Пазл: Комбо Тетрис</title>
  <link rel="stylesheet" href="style.css">
  <!-- Yandex Games SDK (будет работать на платформе, а локально включится режим эмуляции) -->
  <script src="https://yandex.ru/games/sdk/v2"></script>
</head>
<body>
  <div id="game-container">
    <!-- Верхняя панель: Очки, Рекорд, Звук -->
    <header id="header">
      <div class="score-box">
        <span class="label">СЧЁТ</span>
        <span id="current-score" class="value">0</span>
      </div>

      <div class="header-controls">
        <button id="btn-sound" class="icon-btn" title="Вкл/Выкл звук">
          <svg id="sound-icon-on" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg id="sound-icon-off" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display: none;">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
      </div>

      <div class="score-box best">
        <span class="label">РЕКОРД</span>
        <span id="best-score" class="value">0</span>
      </div>
    </header>

    <!-- Игровой холст -->
    <main id="canvas-wrapper">
      <canvas id="game-canvas"></canvas>

      <!-- Панель бустеров за рекламу -->
      <div id="boosters-bar" class="boosters-bar">
        <button id="btn-booster-rotate" class="booster-btn" title="Повернуть фигуру">
          <div class="booster-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
            </svg>
          </div>
          <span class="booster-name">Поворот</span>
          <span id="badge-rotate" class="booster-badge">1</span>
        </button>

        <button id="btn-booster-hammer" class="booster-btn" title="Разбить клетку молотом">
          <div class="booster-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M2.5 19.5l4-4 1.41 1.41-4 4zm18.3-13.8l-3.2-3.2c-.4-.4-1-.4-1.4 0l-2.2 2.2 4.6 4.6 2.2-2.2c.4-.4.4-1 0-1.4zm-7.5 1.7l-7.7 7.7c-.2.2-.3.5-.3.8v1.7h1.7c.3 0 .6-.1.8-.3l7.7-7.7-2.2-2.2z"/>
            </svg>
          </div>
          <span class="booster-name">Молот</span>
          <span id="badge-hammer" class="booster-badge">1</span>
        </button>

        <button id="btn-booster-reroll" class="booster-btn" title="Новые фигуры за рекламу">
          <div class="booster-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
          </div>
          <span class="booster-name">Замена</span>
          <span id="badge-reroll" class="booster-badge ad-badge">📺</span>
        </button>
      </div>

      <!-- Подсказка активного бустера -->
      <div id="booster-hint" class="booster-hint hidden">
        <span id="booster-hint-text">Нажмите на фигуру внизу для поворота</span>
        <button id="btn-cancel-booster" class="btn-cancel-booster">✕</button>
      </div>
      
      <!-- Всплывающий комбо-текст -->
      <div id="combo-popup" class="combo-popup hidden">
        <div id="combo-title" class="combo-title">COMBO x2!</div>
        <div id="combo-subtitle" class="combo-subtitle">ОТЛИЧНО!</div>
      </div>
    </main>

    <!-- Модальное окно Game Over -->
    <div id="game-over-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2 class="game-over-title">ХОДОВ НЕТ</h2>
        <div class="final-score-container">
          <div class="final-score-label">ВАШ СЧЁТ</div>
          <div id="final-score" class="final-score-value">0</div>
        </div>
        <div id="new-record-badge" class="new-record-badge hidden">🏆 НОВЫЙ РЕКОРД!</div>
        
        <div class="modal-buttons">
          <button id="btn-restart" class="btn btn-primary">ИГРАТЬ СНОВА</button>
          <button id="btn-revive" class="btn btn-rewarded hidden">
            <span>💥 ОЧИСТИТЬ ПОЛЕ (РЕКЛАМА)</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="yandex-sdk.js"></script>
  <script src="game.js"></script>
</body>
</html>
